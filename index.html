<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dziennik Elektroniczny + Komunikator + Plan lekcji + Czasowy test + Zadania</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --primary: #1a56db; --primary-dark: #1e429f; }
    body { background: #f3f4f6; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
    .navbar { background: linear-gradient(135deg, #1a56db, #1e3a8a) !important; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .card-header { background: transparent; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
    .btn-primary { background: var(--primary); border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .grade-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 36px; height: 36px; border-radius: 8px; font-weight: 700; font-size: 1rem;
      background: #dbeafe; color: #1e40af;
    }
    .grade-badge.high { background: #d1fae5; color: #065f46; }
    .grade-badge.mid { background: #fef3c7; color: #92400e; }
    .grade-badge.low { background: #fee2e2; color: #991b1b; }
    .stat-card { transition: transform .15s; }
    .stat-card:hover { transform: translateY(-2px); }
    .nav-pills .nav-link { border-radius: 8px; color: #4b5563; font-weight: 500; }
    .nav-pills .nav-link.active { background: var(--primary); }
    .table th { font-weight: 600; font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; color: #6b7280; }
    .login-box {
      max-width: 420px; margin: 3rem auto;
      background: white; border-radius: 16px; padding: 2.5rem;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
    }
    .logo { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .role-badge { font-size: .7rem; padding: .25rem .6rem; border-radius: 20px; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: #9ca3af; }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: .5; }
    #app { display: none; }
    #auth { display: none; }
    .sidebar-nav .nav-link { padding: .65rem 1rem; margin-bottom: .25rem; }
    .badge-obecny { background: #d1fae5; color: #065f46; }
    .badge-nieobecny { background: #fee2e2; color: #991b1b; }
    .badge-spozniony { background: #fef3c7; color: #92400e; }
    .badge-usprawiedliwiony { background: #e0e7ff; color: #3730a3; }
    .toast-container { z-index: 9999; }
    .option-row { cursor: pointer; border: 2px solid #e5e7eb; border-radius: 10px; padding: .75rem 1rem; margin-bottom: .5rem; transition: .15s; }
    .option-row:hover { border-color: #93c5fd; background: #f0f9ff; }
    .option-row.selected { border-color: var(--primary); background: #dbeafe; }
    .q-card { border-left: 4px solid var(--primary); }
    .test-status-active { background: #d1fae5; color: #065f46; }
    .test-status-draft { background: #f3f4f6; color: #6b7280; }
    .chat-box { height: 380px; overflow-y: auto; padding: 1rem; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb; }
    .chat-msg { margin-bottom: 0.75rem; max-width: 75%; }
    .chat-msg.mine { margin-left: auto; text-align: right; }
    .chat-bubble { display: inline-block; padding: 0.6rem 0.9rem; border-radius: 12px; font-size: 0.95rem; text-align: left; }
    .chat-msg.mine .chat-bubble { background: var(--primary); color: white; border-bottom-right-radius: 2px; }
    .chat-msg:not(.mine) .chat-bubble { background: #e5e7eb; color: #1f2937; border-bottom-left-radius: 2px; }
    .chat-user-list { max-height: 420px; overflow-y: auto; }
    .chat-user-item { cursor: pointer; transition: .15s; }
    .chat-user-item:hover, .chat-user-item.active { background: #eff6ff; color: var(--primary); font-weight: 600; }
    .timetable-cell { min-height: 70px; vertical-align: top; }
  </style>
</head>
<body>
  <div id="auth">
    <div class="container">
      <div class="login-box">
        <div class="text-center mb-4">
          <div class="logo"><i class="bi bi-journal-bookmark-fill"></i> Dziennik</div>
          <p class="text-muted small mt-1">Elektroniczny dziennik szkolny + czasowe testy + plan + zadania</p>
        </div>
        <ul class="nav nav-pills nav-fill mb-4" id="authTabs">
          <li class="nav-item"><button class="nav-link active" data-tab="login">Logowanie</button></li>
          <li class="nav-item"><button class="nav-link" data-tab="register">Rejestracja ucznia</button></li>
        </ul>
        <div id="loginForm">
          <div class="mb-3">
            <label class="form-label">Login</label>
            <input type="text" class="form-control" id="loginUsername" placeholder="Twój login" autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label">Hasło</label>
            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
          </div>
          <div class="alert alert-danger d-none" id="loginError"></div>
          <button class="btn btn-primary w-100 py-2 mb-2" onclick="doLogin()">
            <i class="bi bi-box-arrow-in-right"></i> Zaloguj się
          </button>
          <div class="text-center">
            <a href="#" class="small text-muted" onclick="showRecoveryModal(event)">Nie pamiętasz hasła? (Przypomnij słowem kluczowym)</a>
          </div>
        </div>
        <div id="registerForm" class="d-none">
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label">Imię</label>
              <input type="text" class="form-control" id="regFirstName">
            </div>
            <div class="col-6">
              <label class="form-label">Nazwisko</label>
              <input type="text" class="form-control" id="regLastName">
            </div>
          </div>
          <div class="mb-3 mt-2">
            <label class="form-label">Login</label>
            <input type="text" class="form-control" id="regUsername" placeholder="min. 3 znaki">
          </div>
          <div class="mb-3">
            <label class="form-label">Hasło</label>
            <input type="password" class="form-control" id="regPassword" placeholder="min. 4 znaki">
          </div>
          <div class="mb-3">
            <label class="form-label">Słowo powiązane (przypomnienie hasła)</label>
            <input type="text" class="form-control" id="regSecretWord" placeholder="np. pies, szkoła">
          </div>
          <div class="mb-3">
            <label class="form-label">Kod weryfikacyjny (opcjonalnie)</label>
            <input type="text" class="form-control" id="regVerificationCode" placeholder="np. CODE-1234">
          </div>
          <div class="alert alert-danger d-none" id="regError"></div>
          <div class="alert alert-success d-none" id="regSuccess"></div>
          <button class="btn btn-primary w-100 py-2" onclick="doRegister()">
            <i class="bi bi-person-plus"></i> Załóż konto ucznia
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="app">
    <nav class="navbar navbar-dark sticky-top">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-journal-bookmark-fill"></i> Dziennik Elektroniczny Rozszerzony</span>
        <div class="d-flex align-items-center gap-3 text-white">
          <span id="userInfo" class="small"></span>
          <button class="btn btn-outline-light btn-sm" onclick="doLogout()"><i class="bi bi-box-arrow-right"></i> Wyloguj</button>
        </div>
      </div>
    </nav>
    <div class="container-fluid py-4">
      <div class="row">
        <div class="col-lg-2 col-md-3 mb-3">
          <div class="card">
            <div class="card-body p-2">
              <nav class="nav flex-column sidebar-nav" id="sideNav"></nav>
            </div>
          </div>
        </div>
        <div class="col-lg-10 col-md-9">
          <div id="content"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal odzyskiwania hasła -->
  <div class="modal fade" id="recoveryModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Przypomnienie hasła</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Login</label>
            <input type="text" class="form-control" id="recUsername">
          </div>
          <div class="mb-3">
            <label class="form-label">Słowo powiązane (zrejestrowane)</label>
            <input type="text" class="form-control" id="recSecretWord">
          </div>
          <div class="alert alert-info d-none" id="recResult"></div>
          <div class="alert alert-danger d-none" id="recError"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Zamknij</button>
          <button type="button" class="btn btn-primary" onclick="doRecoverPassword()">Sprawdź</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal edycji godzin planu lekcji -->
  <div class="modal fade" id="hourSlotsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Zarządzanie godzinami planu lekcji</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="hourSlotsEditorList" class="mb-3"></div>
          <button class="btn btn-outline-primary btn-sm" onclick="addHourSlotRow()">+ Dodaj godzinę</button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button>
          <button type="button" class="btn btn-primary" onclick="saveHourSlotsFromModal()">Zapisz godziny</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast align-items-center text-bg-dark border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastBody"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const STORAGE_KEY = 'dziennik_elektroniczny_v7_extended';
    const SESSION_KEY = 'dziennik_user_v7';
    let memoryStore = null;
    let storageAvailable = false;
    const DEFAULT_HOUR_SLOTS = ['1. 8:00 - 8:45', '2. 8:55 - 9:40', '3. 9:50 - 10:35', '4. 10:55 - 11:40', '5. 11:50 - 12:35', '6. 12:45 - 13:30'];

    function canUseStorage(store) {
      try {
        const t = '__test__';
        store.setItem(t, t);
        store.removeItem(t);
        return true;
      } catch (e) { return false; }
    }

    try { storageAvailable = canUseStorage(window.localStorage); } catch (e) { storageAvailable = false; }

    function emptyDB() {
      return { 
        users: [], classes: [], subjects: [], grades: [], attendance: [], 
        remarks: [], tests: [], submissions: [], messages: [], class_chats: [], 
        timetable: [], verificationCodes: [], hourSlots: [...DEFAULT_HOUR_SLOTS],
        homework: [], homework_submissions: [], announcements: []
      };
    }

    function loadDB() {
      if (storageAvailable) {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const d = JSON.parse(raw);
            if (!d.tests) d.tests = [];
            if (!d.submissions) d.submissions = [];
            if (!d.messages) d.messages = [];
            if (!d.class_chats) d.class_chats = [];
            if (!d.timetable) d.timetable = [];
            if (!d.verificationCodes) d.verificationCodes = [];
            if (!d.homework) d.homework = [];
            if (!d.homework_submissions) d.homework_submissions = [];
            if (!d.announcements) d.announcements = [];
            if (!d.hourSlots || !d.hourSlots.length) d.hourSlots = [...DEFAULT_HOUR_SLOTS];
            return d;
          }
        } catch (e) {}
      }
      if (memoryStore) return memoryStore;
      return emptyDB();
    }

    function saveDB(db) {
      memoryStore = db;
      if (storageAvailable) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
        catch (e) { storageAvailable = false; }
      }
    }

    let db = loadDB();
    memoryStore = db;

    if (!db.users.find(u => u.role === 'teacher')) {
      db.users.push({
        id: 'teacher-1',
        username: 'nauczyciel',
        password: 'domotokoks',
        role: 'teacher',
        firstName: 'Jan',
        lastName: 'Kowalski',
        createdAt: new Date().toISOString()
      });
      saveDB(db);
    }

    function saveSession(user) {
      try {
        if (canUseStorage(window.sessionStorage)) {
          sessionStorage.setItem(SESSION_KEY, JSON.stringify(user));
          return;
        }
      } catch (e) {}
      window.__dziennikSession = user;
    }
    function loadSession() {
      try {
        if (canUseStorage(window.sessionStorage)) {
          const s = sessionStorage.getItem(SESSION_KEY);
          if (s) return JSON.parse(s);
        }
      } catch (e) {}
      return window.__dziennikSession || null;
    }
    function clearSession() {
      try {
        if (canUseStorage(window.sessionStorage)) sessionStorage.removeItem(SESSION_KEY);
      } catch (e) {}
      window.__dziennikSession = null;
    }

    let currentUser = null;
    let toastInstance = null;
    let editingTestId = null;
    let activeChatPartnerId = null;
    let activeClassChatId = null;
    let testTimerInterval = null;

    function showToast(msg, isError = false) {
      const el = document.getElementById('toast');
      document.getElementById('toastBody').textContent = msg;
      el.className = `toast align-items-center border-0 ${isError ? 'text-bg-danger' : 'text-bg-dark'}`;
      if (!toastInstance) toastInstance = new bootstrap.Toast(el, { delay: 2800 });
      toastInstance.show();
    }

    function uid() {
      return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function gradeClass(val) {
      const n = parseFloat(String(val).replace(',', '.').replace('+', '.25').replace('-', '-.25'));
      if (isNaN(n)) return '';
      if (n >= 4.5) return 'high';
      if (n >= 3) return 'mid';
      return 'low';
    }

    function statusBadge(s) {
      const map = { obecny: 'badge-obecny', nieobecny: 'badge-nieobecny', 'spóźniony': 'badge-spozniony', usprawiedliwiony: 'badge-usprawiedliwiony' };
      return `<span class="badge ${map[s] || 'bg-secondary'}">${s}</span>`;
    }

    document.querySelectorAll('#authTabs .nav-link').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#authTabs .nav-link').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('loginForm').classList.toggle('d-none', tab !== 'login');
        document.getElementById('registerForm').classList.toggle('d-none', tab !== 'register');
      });
    });

    function showRecoveryModal(e) {
      if (e) e.preventDefault();
      document.getElementById('recUsername').value = '';
      document.getElementById('recSecretWord').value = '';
      document.getElementById('recResult').classList.add('d-none');
      document.getElementById('recError').classList.add('d-none');
      new bootstrap.Modal(document.getElementById('recoveryModal')).show();
    }

    function doRecoverPassword() {
      const username = document.getElementById('recUsername').value.trim();
      const secret = document.getElementById('recSecretWord').value.trim().toLowerCase();
      const res = document.getElementById('recResult');
      const err = document.getElementById('recError');
      res.classList.add('d-none');
      err.classList.add('d-none');
      const user = db.users.find(u => u.username.toLowerCase() === username.toLowerCase());
      if (!user || (user.secretWord || '').toLowerCase() !== secret) {
        err.textContent = 'Niepoprawny login lub słowo powiązane';
        err.classList.remove('d-none');
        return;
      }
      res.textContent = `Twoje hasło to: ${user.password}`;
      res.classList.remove('d-none');
    }

    function doLogin() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const err = document.getElementById('loginError');
      err.classList.add('d-none');
      const user = db.users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);
      if (!user) {
        err.textContent = 'Nieprawidłowy login lub hasło';
        err.classList.remove('d-none');
        return;
      }
      currentUser = { id: user.id, username: user.username, firstName: user.firstName, lastName: user.lastName, role: user.role, classId: user.classId };
      saveSession(currentUser);
      showApp();
    }

    function doRegister() {
      const firstName = document.getElementById('regFirstName').value.trim();
      const lastName = document.getElementById('regLastName').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const secretWord = document.getElementById('regSecretWord').value.trim();
      const verCode = document.getElementById('regVerificationCode').value.trim();
      const err = document.getElementById('regError');
      const ok = document.getElementById('regSuccess');
      err.classList.add('d-none');
      ok.classList.add('d-none');
      if (!firstName || !lastName || !username || !password || !secretWord) {
        err.textContent = 'Wszystkie główne pola są wymagane';
        err.classList.remove('d-none');
        return;
      }
      if (username.length < 3) { err.textContent = 'Login min. 3 znaki'; err.classList.remove('d-none'); return; }
      if (password.length < 4) { err.textContent = 'Hasło min. 4 znaki'; err.classList.remove('d-none'); return; }
      if (db.users.find(u => u.username.toLowerCase() === username.toLowerCase())) {
        err.textContent = 'Taki login już istnieje';
        err.classList.remove('d-none');
        return;
      }
      let assignedClassId = null;
      if (verCode) {
        const foundCode = (db.verificationCodes || []).find(c => c.code.toLowerCase() === verCode.toLowerCase() && !c.used);
        if (!foundCode) {
          err.textContent = 'Nieprawidłowy lub wykorzystany kod weryfikacyjny';
          err.classList.remove('d-none');
          return;
        }
        assignedClassId = foundCode.classId || null;
        foundCode.used = true;
      }
      db.users.push({
        id: uid(), username, password, secretWord, role: 'student',
        firstName, lastName, classId: assignedClassId, createdAt: new Date().toISOString()
      });
      saveDB(db);
      ok.textContent = 'Konto utworzone! Możesz się zalogować.';
      ok.classList.remove('d-none');
      document.getElementById('regFirstName').value = '';
      document.getElementById('regLastName').value = '';
      document.getElementById('regUsername').value = '';
      document.getElementById('regPassword').value = '';
      document.getElementById('regSecretWord').value = '';
      document.getElementById('regVerificationCode').value = '';
    }

    function showApp() {
      document.getElementById('auth').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('userInfo').textContent = `${currentUser.firstName} ${currentUser.lastName} (${currentUser.role === 'teacher' ? 'Nauczyciel' : 'Uczeń'})`;
      loadSidebar();
      showDashboard();
    }

    function doLogout() {
      currentUser = null;
      clearSession();
      document.getElementById('auth').style.display = 'block';
      document.getElementById('app').style.display = 'none';
      document.getElementById('loginUsername').value = '';
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginError').classList.add('d-none');
      showToast('Wylogowano');
    }

    function loadSidebar() {
      const nav = document.getElementById('sideNav');
      nav.innerHTML = '';
      const items = [
        { name: 'Pulpit', icon: 'house-fill', action: 'showDashboard()' },
        { name: 'Oceny', icon: 'star-fill', action: 'showGrades()' },
        { name: 'Frekwencja', icon: 'calendar-check', action: 'showAttendance()' },
        { name: 'Plan lekcji', icon: 'calendar-event', action: 'showTimetable()' },
        { name: 'Testy', icon: 'pencil-square', action: 'showTests()' },
        { name: 'Zadania', icon: 'list-check', action: 'showHomework()' },
        { name: 'Komunikator', icon: 'chat-dots', action: 'showChat()' },
        { name: 'Ogłoszenia', icon: 'megaphone', action: 'showAnnouncements()' }
      ];
      if (currentUser.role === 'teacher') {
        items.push({ name: 'Zarządzanie', icon: 'gear', action: 'showManagement()' });
      }
      items.forEach(item => {
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'nav-link text-dark';
        a.innerHTML = `<i class="bi bi-${item.icon}"></i> ${item.name}`;
        a.onclick = (e) => { e.preventDefault(); eval(item.action); };
        nav.appendChild(a);
      });
    }

    function showDashboard() {
      const cont = document.getElementById('content');
      cont.innerHTML = `
        <div class="row">
          <div class="col-md-6">
            <div class="card stat-card">
              <div class="card-body">
                <h6 class="card-title text-muted">Średnia ocen</h6>
                <h3>${calculateGradeAverage().toFixed(2)}</h3>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card stat-card">
              <div class="card-body">
                <h6 class="card-title text-muted">Nieobecności</h6>
                <h3>${(db.attendance || []).filter(a => a.studentId === currentUser.id && a.status === 'nieobecny').length}</h3>
              </div>
            </div>
          </div>
        </div>
        <div class="card mt-4">
          <div class="card-header">Ostatnie oceny</div>
          <div class="card-body">
            ${(db.grades || []).filter(g => g.studentId === currentUser.id).slice(-5).map(g => 
              `<div class="d-flex justify-content-between mb-2">
                <span>${g.subject} - ${g.topic}</span>
                <span class="grade-badge ${gradeClass(g.value)}">${g.value}</span>
              </div>`
            ).join('') || '<p class="text-muted">Brak ocen</p>'}
          </div>
        </div>
      `;
    }

    function calculateGradeAverage() {
      const grades = (db.grades || []).filter(g => g.studentId === currentUser.id);
      if (!grades.length) return 0;
      const vals = grades.map(g => parseFloat(String(g.value).replace(',', '.').replace('+', '.25').replace('-', '-.25'))).filter(v => !isNaN(v));
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
    }

    function showGrades() {
      const cont = document.getElementById('content');
      const grades = (db.grades || []).filter(g => g.studentId === currentUser.id);
      cont.innerHTML = `
        <div class="card">
          <div class="card-header">
            Oceny
            ${currentUser.role === 'teacher' ? `<button class="btn btn-sm btn-primary float-end" onclick="editGradeTeacher()">+ Dodaj</button>` : ''}
          </div>
          <table class="table table-sm mb-0">
            <thead>
              <tr><th>Przedmiot</th><th>Temat</th><th>Ocena</th><th>Data</th></tr>
            </thead>
            <tbody>
              ${grades.map(g => `
                <tr>
                  <td>${g.subject}</td>
                  <td>${g.topic}</td>
                  <td><span class="grade-badge ${gradeClass(g.value)}">${g.value}</span></td>
                  <td>${new Date(g.date).toLocaleDateString('pl-PL')}</td>
                </tr>
              `).join('') || '<tr><td colspan="4" class="text-center text-muted">Brak ocen</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }

    function editGradeTeacher() {
      if (currentUser.role !== 'teacher') return;
      const subject = prompt('Przedmiot:');
      const topic = prompt('Temat:');
      const value = prompt('Ocena:');
      const studentId = prompt('ID ucznia:');
      if (subject && topic && value && studentId) {
        db.grades.push({ id: uid(), studentId, subject, topic, value, date: new Date().toISOString() });
        saveDB(db);
        showToast('Ocena dodana');
        showGrades();
      }
    }

    function showAttendance() {
      const cont = document.getElementById('content');
      const att = (db.attendance || []).filter(a => a.studentId === currentUser.id);
      cont.innerHTML = `
        <div class="card">
          <div class="card-header">Frekwencja</div>
          <table class="table table-sm mb-0">
            <thead>
              <tr><th>Data</th><th>Status</th></tr>
            </thead>
            <tbody>
              ${att.map(a => `
                <tr>
                  <td>${new Date(a.date).toLocaleDateString('pl-PL')}</td>
                  <td>${statusBadge(a.status)}</td>
                </tr>
              `).join('') || '<tr><td colspan="2" class="text-center text-muted">Brak danych</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }

    function showTimetable() {
      const cont = document.getElementById('content');
      const days = ['Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek'];
      const tt = db.timetable.filter(t => t.classId === currentUser.classId);
      cont.innerHTML = `
        <div class="card">
          <div class="card-header">
            Plan lekcji
            ${currentUser.role === 'teacher' ? `<button class="btn btn-sm btn-primary float-end" onclick="editTimetable()">Edytuj</button>` : ''}
          </div>
          <table class="table table-sm mb-0">
            <thead>
              <tr><th>Godzina</th>${days.map(d => `<th>${d}</th>`).join('')}</tr>
            </thead>
            <tbody>
              ${db.hourSlots.map((slot, idx) => `
                <tr>
                  <td><small>${slot}</small></td>
                  ${days.map(day => {
                    const lesson = tt.find(t => t.slot === idx && t.dayOfWeek === days.indexOf(day));
                    return `<td class="timetable-cell"><small>${lesson ? `${lesson.subject} (${lesson.teacher})` : '-'}</small></td>`;
                  }).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function editTimetable() {
      if (currentUser.role !== 'teacher') return;
      showToast('Edycja planu - funkcja w trakcie');
    }

    function showTests() {
      const cont = document.getElementById('content');
      const tests = currentUser.role === 'teacher' ? (db.tests || []) : (db.tests || []).filter(t => t.status === 'active');
      cont.innerHTML = `
        <div class="card">
          <div class="card-header">
            Testy
            ${currentUser.role === 'teacher' ? `<button class="btn btn-sm btn-primary float-end" onclick="createTest()">+ Nowy test</button>` : ''}
          </div>
          <div class="card-body">
            ${tests.map(t => `
              <div class="card q-card mb-2">
                <div class="card-body">
                  <h6 class="card-title">${t.title}</h6>
                  <p class="card-text small text-muted">${t.description}</p>
                  <span class="badge ${t.status === 'active' ? 'test-status-active' : 'test-status-draft'}">${t.status}</span>
                  ${currentUser.role === 'student' && t.status === 'active' ? `<button class="btn btn-sm btn-primary float-end" onclick="startTest('${t.id}')">Rozwiąż</button>` : ''}
                  ${currentUser.role === 'teacher' ? `<button class="btn btn-sm btn-warning float-end me-2" onclick="editTest('${t.id}')">Edytuj</button>` : ''}
                </div>
              </div>
            `).join('') || '<p class="text-muted">Brak testów</p>'}
          </div>
        </div>
      `;
    }

    function createTest() {
      if (currentUser.role !== 'teacher') return;
      const title = prompt('Tytuł testu:');
      const desc = prompt('Opis:');
      if (title && desc) {
        db.tests.push({ id: uid(), title, description: desc, status: 'draft', questions: [], createdBy: currentUser.id, createdAt: new Date().toISOString() });
        saveDB(db);
        showToast('Test utworzony');
        showTests();
      }
    }

    function editTest(testId) {
      if (currentUser.role !== 'teacher') return;
      editingTestId = testId;
      showToast('Edycja testów - funkcja w trakcie');
    }

    function startTest(testId) {
      const test = db.tests.find(t => t.id === testId);
      if (!test) return;
      const cont = document.getElementById('content');
      cont.innerHTML = `
        <div class="card">
          <div class="card-header">${test.title}</div>
          <div class="card-body">
            <p>${test.description}</p>
            <div class="alert alert-info">Pytania będą tutaj. Funkcja w trakcie implementacji.</div>
            <button class="btn btn-secondary" onclick="showTests()">Wróć</button>
          </div>
        </div>
      `;
    }

    function showHomework() {
      const cont = document.getElementById('content');
      const hw = currentUser.role === 'student' ? (db.homework || []).filter(h => h.classId === currentUser.classId) : (db.homework || []);
      cont.innerHTML = `
        <div class="card">
          <div class="card-header">
            Zadania
            ${currentUser.role === 'teacher' ? `<button class="btn btn-sm btn-primary float-end" onclick="createHomework()">+ Dodaj zadanie</button>` : ''}
          </div>
          <div class="card-body">
            ${hw.map(h => `
              <div class="card mb-3">
                <div class="card-body">
                  <h6>${h.title}</h6>
                  <p class="small text-muted">${h.description}</p>
                  <small><strong>Termin:</strong> ${new Date(h.deadline).toLocaleDateString('pl-PL')}</small>
                  ${currentUser.role === 'student' ? `<button class="btn btn-sm btn-primary float-end" onclick="submitHomework('${h.id}')">Wyślij</button>` : ''}
                </div>
              </div>
            `).join('') || '<p class="text-muted">Brak zadań</p>'}
          </div>
        </div>
      `;
    }

    function createHomework() {
      if (currentUser.role !== 'teacher') return;
      const title = prompt('Tytuł:');
      const desc = prompt('Opis:');
      const deadline = prompt('Termin (YYYY-MM-DD):');
      if (title && desc && deadline) {
        db.homework.push({ id: uid(), title, description: desc, deadline, classId: currentUser.classId, createdBy: currentUser.id });
        saveDB(db);
        showToast('Zadanie dodane');
        showHomework();
      }
    }

    function submitHomework(hwId) {
      const hw = db.homework.find(h => h.id === hwId);
      if (!hw) return;
      const answer = prompt('Twoja odpowiedź:');
      if (answer) {
        db.homework_submissions.push({ id: uid(), homeworkId: hwId, studentId: currentUser.id, answer, submittedAt: new Date().toISOString() });
        saveDB(db);
        showToast('Zadanie wysłane');
      }
    }

    function showChat() {
      const cont = document.getElementById('content');
      const users = db.users.filter(u => u.id !== currentUser.id);
      const msgs = (db.messages || []).filter(m => (m.senderId === currentUser.id || m.receiverId === currentUser.id) && (activeChatPartnerId === null || m.senderId === activeChatPartnerId || m.receiverId === activeChatPartnerId));
      cont.innerHTML = `
        <div class="row">
          <div class="col-md-3">
            <div class="card">
              <div class="card-header">Użytkownicy</div>
              <div class="chat-user-list">
                ${users.map(u => `
                  <div class="chat-user-item p-2 ${activeChatPartnerId === u.id ? 'active' : ''}" onclick="selectChatPartner('${u.id}')">
                    ${u.firstName} ${u.lastName}
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
          <div class="col-md-9">
            <div class="card">
              <div class="card-header">Wiadomości ${activeChatPartnerId ? `(${db.users.find(u => u.id === activeChatPartnerId)?.firstName || 'Nieznany'})` : ''}</div>
              <div class="chat-box">
                ${msgs.map(m => `
                  <div class="chat-msg ${m.senderId === currentUser.id ? 'mine' : ''}">
                    <div class="chat-bubble">${m.text}</div>
                  </div>
                `).join('')}
              </div>
              ${activeChatPartnerId ? `
                <div class="card-body pt-2">
                  <div class="input-group">
                    <input type="text" class="form-control" id="chatInput" placeholder="Wpisz wiadomość...">
                    <button class="btn btn-primary" onclick="sendMessage()">Wyślij</button>
                  </div>
                </div>
              ` : '<p class="card-body text-muted">Wybierz użytkownika</p>'}
            </div>
          </div>
        </div>
      `;
    }

    function selectChatPartner(userId) {
      activeChatPartnerId = userId;
      showChat();
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      if (input && input.value.trim() && activeChatPartnerId) {
        db.messages.push({ id: uid(), senderId: currentUser.id, receiverId: activeChatPartnerId, text: input.value, sentAt: new Date().toISOString() });
        saveDB(db);
        input.value = '';
        showChat();
      }
    }

    function showAnnouncements() {
      const cont = document.getElementById('content');
      const ann = db.announcements || [];
      cont.innerHTML = `
        <div class="card">
          <div class="card-header">
            Ogłoszenia
            ${currentUser.role === 'teacher' ? `<button class="btn btn-sm btn-primary float-end" onclick="createAnnouncement()">+ Dodaj ogłoszenie</button>` : ''}
          </div>
          <div class="card-body">
            ${ann.map(a => `
              <div class="card mb-3">
                <div class="card-body">
                  <h6>${a.title}</h6>
                  <p>${a.text}</p>
                  <small class="text-muted">${new Date(a.createdAt).toLocaleDateString('pl-PL')}</small>
                </div>
              </div>
            `).join('') || '<p class="text-muted">Brak ogłoszeń</p>'}
          </div>
        </div>
      `;
    }

    function createAnnouncement() {
      if (currentUser.role !== 'teacher') return;
      const title = prompt('Tytuł:');
      const text = prompt('Treść:');
      if (title && text) {
        db.announcements.push({ id: uid(), title, text, createdBy: currentUser.id, createdAt: new Date().toISOString() });
        saveDB(db);
        showToast('Ogłoszenie dodane');
        showAnnouncements();
      }
    }

    function showManagement() {
      if (currentUser.role !== 'teacher') return;
      const cont = document.getElementById('content');
      cont.innerHTML = `
        <div class="row">
          <div class="col-md-4">
            <div class="card">
              <div class="card-body">
                <h6>Zarządzanie użytkownikami</h6>
                <button class="btn btn-sm btn-primary w-100" onclick="manageUsers()">Edytuj</button>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card">
              <div class="card-body">
                <h6>Godziny planu lekcji</h6>
                <button class="btn btn-sm btn-primary w-100" onclick="openHourSlotsModal()">Edytuj</button>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card">
              <div class="card-body">
                <h6>Kody weryfikacyjne</h6>
                <button class="btn btn-sm btn-primary w-100" onclick="manageVerificationCodes()">Zarządzaj</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function manageUsers() {
      showToast('Zarządzanie użytkownikami - funkcja w trakcie');
    }

    function openHourSlotsModal() {
      const list = document.getElementById('hourSlotsEditorList');
      list.innerHTML = db.hourSlots.map((slot, idx) => `
        <div class="input-group mb-2">
          <input type="text" class="form-control" id="slot${idx}" value="${slot}">
          <button class="btn btn-outline-danger" onclick="removeHourSlot(${idx})">Usuń</button>
        </div>
      `).join('');
      new bootstrap.Modal(document.getElementById('hourSlotsModal')).show();
    }

    function addHourSlotRow() {
      const list = document.getElementById('hourSlotsEditorList');
      const idx = db.hourSlots.length;
      const div = document.createElement('div');
      div.className = 'input-group mb-2';
      div.innerHTML = `
        <input type="text" class="form-control" id="slot${idx}" placeholder="np. 7. 14:00 - 14:45">
        <button class="btn btn-outline-danger" onclick="removeHourSlot(${idx})">Usuń</button>
      `;
      list.appendChild(div);
    }

    function removeHourSlot(idx) {
      document.getElementById(`slot${idx}`).parentElement.remove();
    }

    function saveHourSlotsFromModal() {
      const slots = [];
      document.querySelectorAll('#hourSlotsEditorList input').forEach(inp => {
        if (inp.value.trim()) slots.push(inp.value.trim());
      });
      if (slots.length) {
        db.hourSlots = slots;
        saveDB(db);
        bootstrap.Modal.getInstance(document.getElementById('hourSlotsModal')).hide();
        showToast('Godziny zapisane');
      }
    }

    function manageVerificationCodes() {
      showToast('Zarządzanie kodami - funkcja w trakcie');
    }

    window.addEventListener('load', () => {
      const session = loadSession();
      if (session) {
        currentUser = session;
        showApp();
      } else {
        document.getElementById('auth').style.display = 'block';
      }
    });
  </script>
</body>
</html>
