<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dziennik Elektroniczny</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --primary: #1a56db; --primary-dark: #1e429f; }
    body { background: #f3f4f6; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
    .navbar { background: linear-gradient(135deg, #1a56db, #1e3a8a) !important; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .btn-primary { background: var(--primary); border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .grade-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 36px; border-radius: 8px; font-weight: 700; font-size: 1rem; background: #dbeafe; color: #1e40af; }
    .login-box { max-width: 440px; margin: 3rem auto; background: white; border-radius: 16px; padding: 2.2rem; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
    .logo { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .role-badge { font-size: .7rem; padding: .25rem .6rem; border-radius: 20px; }
    #app, #auth { display: none; }
    .sidebar-nav .nav-link { padding: .6rem 1rem; margin-bottom: .2rem; color: #4b5563; border-radius: 8px; }
    .sidebar-nav .nav-link.active { background: #eff6ff; color: var(--primary); font-weight: 600; }
    .code-display { font-family: monospace; font-size: 1.3rem; letter-spacing: .25em; font-weight: 700; color: var(--primary); }
    .chat-box { height: 280px; overflow-y: auto; padding: 1rem; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb; }
    .timer-alert { font-family: monospace; font-size: 1.2rem; font-weight: 700; color: #dc2626; }
    .toast-container { z-index: 9999; }
    .badge-obecny { background: #d1fae5; color: #065f46; }
    .badge-nieobecny { background: #fee2e2; color: #991b1b; }
    .badge-spóźniony { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>

  <!-- AUTORYZACJA -->
  <div id="auth">
    <div class="container">
      <div class="login-box">
        <div class="text-center mb-4">
          <div class="logo"><i class="bi bi-journal-bookmark-fill"></i> Dziennik</div>
          <p class="text-muted small mt-1">System szkolny z weryfikacją kodem</p>
        </div>
        <ul class="nav nav-pills nav-fill mb-4" id="authTabs">
          <li class="nav-item"><button class="nav-link active" data-tab="login">Logowanie</button></li>
          <li class="nav-item"><button class="nav-link" data-tab="register">Rejestracja ucznia</button></li>
        </ul>
        <div id="loginForm">
          <input type="text" class="form-control mb-3" id="loginUsername" placeholder="Login (np. nauczyciel)">
          <input type="password" class="form-control mb-3" id="loginPassword" placeholder="Hasło (np. domotokoks)">
          <div class="alert alert-danger d-none small py-2" id="loginError"></div>
          <button class="btn btn-primary w-100 py-2 mb-2" onclick="doLogin()">Zaloguj się</button>
        </div>
        <div id="registerForm" class="d-none">
          <div class="row g-2 mb-2">
            <div class="col-6"><input type="text" class="form-control" id="regFirstName" placeholder="Imię"></div>
            <div class="col-6"><input type="text" class="form-control" id="regLastName" placeholder="Nazwisko"></div>
          </div>
          <input type="text" class="form-control mb-2" id="regUsername" placeholder="Login">
          <input type="password" class="form-control mb-2" id="regPassword" placeholder="Hasło">
          <input type="text" class="form-control mb-2" id="regSecretWord" placeholder="Słowo kluczowe">
          <input type="text" class="form-control text-center fw-bold mb-3" id="regVerificationCode" maxlength="6" placeholder="6-cyfrowy kod">
          <div class="alert alert-danger d-none small py-2" id="regError"></div>
          <div class="alert alert-success d-none small py-2" id="regSuccess"></div>
          <button class="btn btn-primary w-100 py-2" onclick="doRegister()">Załóż konto</button>
        </div>
      </div>
    </div>
  </div>

  <!-- APLIKACJA -->
  <div id="app">
    <nav class="navbar navbar-dark sticky-top">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-journal-bookmark-fill"></i> Dziennik Elektroniczny</span>
        <div class="d-flex align-items-center gap-3 text-white">
          <span id="userInfo" class="small"></span>
          <button class="btn btn-outline-light btn-sm" onclick="doLogout()"><i class="bi bi-box-arrow-right"></i> Wyloguj</button>
        </div>
      </div>
    </nav>
    <div class="container-fluid py-4">
      <div class="row">
        <div class="col-lg-2 col-md-3 mb-3">
          <div class="card"><div class="card-body p-2"><nav class="nav flex-column sidebar-nav" id="sideNav"></nav></div></div>
        </div>
        <div class="col-lg-10 col-md-9"><div id="content" class="card p-4"></div></div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast align-items-center text-bg-dark border-0" role="alert">
      <div class="d-flex"><div class="toast-body" id="toastBody"></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
